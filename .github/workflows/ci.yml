name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff linter
        run: ruff check .

      - name: Generate synthetic dataset and database
        run: python -m data.generate_data

      - name: Run forecasting and anomaly benchmarks
        run: |
          python -m forecasting.forecaster
          python -m anomaly.detector

      - name: Upload benchmark results artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: results/

      - name: Run Pytest suite
        run: pytest -v

      - name: Build Docker image
        run: docker build -t industrial-equipment-monitoring-agent:ci .
